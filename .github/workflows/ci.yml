name: AquaTrack Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Build & Automated Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full verification (lint, compile, 30 Jest tests)
        run: npm run verify
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/aquatrack_ci_test
          JWT_SECRET: ci-test-secret-string-at-least-32-chars
          ADMIN_PASSWORD: CiAdminPassword123!
          PORT: 5000
